name: ServeQ CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after CI (main only; requires RENDER_DEPLOY_ENABLED)
        type: boolean
        default: false

permissions:
  contents: read

# Keep production runs serialized through deployment verification. Only PR runs
# are canceled when superseded. Pending main runs may be replaced by newer runs.
concurrency:
  group: serveq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: ServeQ ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, build, audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
          VITE_API_URL: https://api.serveq.tech
        run: |
          case "$TASK" in
            lint) npm run lint ;;
            test)
              docker run -d --rm --name serveq-test-valkey -p 127.0.0.1:6379:6379 valkey/valkey:8-alpine
              trap 'docker stop serveq-test-valkey' EXIT
              for attempt in {1..20}; do
                if docker exec serveq-test-valkey valkey-cli ping 2>/dev/null | grep -qx PONG; then break; fi
                sleep 1
              done
              docker exec serveq-test-valkey valkey-cli ping | grep -qx PONG
              RATE_LIMIT_TEST_REDIS_URL=redis://127.0.0.1:6379 npm test
              ;;
            build) npm run build && npm run check:build ;;
            audit) npm audit --omit=dev --audit-level=high ;;
            *) exit 1 ;;
          esac

  docker:
    name: ServeQ backend Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: false
          load: true
          tags: serveq-backend:${{ github.sha }}
          cache-from: type=gha,scope=serveq-backend
          cache-to: type=gha,mode=max,scope=serveq-backend
      - name: Check image imports and secret exclusion
        env:
          IMAGE: serveq-backend:${{ github.sha }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -ec '
            test ! -d /app/.git
            test ! -d /app/.aws
            test ! -f /app/.npmrc
            if find /app -path /app/node_modules -prune -o -name ".env*" -print | grep -q .; then
              echo "Environment files must not be included in the backend image"
              exit 1
            fi
          '
          docker run --rm --env NODE_ENV=test --entrypoint node "$IMAGE" \
            --input-type=module -e "await import('./app.js')"

  frontend:
    name: ServeQ frontend Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          load: true
          tags: serveq-frontend:${{ github.sha }}
          cache-from: type=gha,scope=serveq-frontend
          cache-to: type=gha,mode=max,scope=serveq-frontend
      - name: Validate Nginx and production HTTP routing
        env:
          IMAGE: serveq-frontend:${{ github.sha }}
        run: |
          docker run --rm --add-host backend:127.0.0.1 "$IMAGE" nginx -t
          docker run --detach --name serveq-frontend --add-host backend:127.0.0.1 --publish 127.0.0.1:8080:80 "$IMAGE"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-frontend-http.mjs
      - name: Container diagnostics
        if: ${{ failure() }}
        run: docker logs serveq-frontend || true
      - name: Stop smoke test container
        if: ${{ always() }}
        run: docker rm --force serveq-frontend || true

  gate:
    name: ServeQ CI gate
    if: ${{ always() }}
    needs: [quality, docker, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all validation jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          DOCKER: ${{ needs.docker.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: test "$QUALITY" = success && test "$DOCKER" = success && test "$FRONTEND" = success

  deploy:
    name: ServeQ Render production
    needs: gate
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          vars.RENDER_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    environment:
      name: production
      url: https://api.serveq.tech
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # No npm install and no production application secrets in this job.
      - name: Validate service, deploy exact commit, and verify
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/render-deploy.mjs
      - name: Record deployment result
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Render production job: **$RESULT**. See verification stages above; a hook response alone is not deployment success." >> "$GITHUB_STEP_SUMMARY"
