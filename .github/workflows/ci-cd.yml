name: ServeQ CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after CI (main only; requires RENDER_DEPLOY_ENABLED)
        type: boolean
        default: false

permissions:
  contents: read

# Keep production runs serialized through deployment verification. Only PR runs
# are canceled when superseded. Pending main runs may be replaced by newer runs.
concurrency:
  group: serveq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: ServeQ ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, build, audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
          VITE_API_URL: https://api.serveq.tech
        run: |
          case "$TASK" in
            lint) npm run lint ;;
            test) NODE_ENV=test npm test ;;
            build) npm run build ;;
            audit) npm audit --omit=dev --audit-level=high ;;
            *) exit 1 ;;
          esac

  docker:
    name: ServeQ backend Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: false
          load: true
          tags: serveq-backend:${{ github.sha }}
          cache-from: type=gha,scope=serveq-backend
          cache-to: type=gha,mode=max,scope=serveq-backend
      - name: Check image imports and secret exclusion
        env:
          IMAGE: serveq-backend:${{ github.sha }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -ec '
            test ! -d /app/.git
            test ! -d /app/.aws
            test ! -f /app/.npmrc
            if find /app -path /app/node_modules -prune -o -name ".env*" -print | grep -q .; then
              echo "Environment files must not be included in the backend image"
              exit 1
            fi
          '
          docker run --rm --env NODE_ENV=test --entrypoint node "$IMAGE" \
            --input-type=module -e "await import('./app.js')"

  gate:
    name: ServeQ CI gate
    if: ${{ always() }}
    needs: [quality, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all validation jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          DOCKER: ${{ needs.docker.result }}
        run: test "$QUALITY" = success && test "$DOCKER" = success

  deploy:
    name: ServeQ Render production
    needs: gate
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          vars.RENDER_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    environment:
      name: production
      url: https://api.serveq.tech
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      # No npm install and no production application secrets in this job.
      - name: Validate service, deploy exact commit, and verify
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/render-deploy.mjs
      - name: Record deployment result
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Render production job: **$RESULT**. See verification stages above; a hook response alone is not deployment success." >> "$GITHUB_STEP_SUMMARY"
