<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="q-grad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="dot-grad" x1="38" y1="36" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="24" y="24" width="36" height="36" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Stylized "Q" Queue Loop -->
  <path d="M32 14C22.059 14 14 22.059 14 32C14 41.941 22.059 50 32 50C36.327 50 40.29 48.473 43.407 45.926L48.243 50.762C48.975 51.494 50.163 51.494 50.895 50.762C51.627 50.03 51.627 48.842 50.895 48.11L45.926 43.141C48.473 40.024 50 36.061 50 32C50 22.059 41.941 14 32 14ZM32 20.5C38.351 20.5 43.5 25.649 43.5 32C43.5 38.351 38.351 43.5 32 43.5C25.649 43.5 20.5 38.351 20.5 32C20.5 25.649 25.649 20.5 32 20.5Z" fill="url(#q-grad)"/>

  <!-- Active Live Queue Center / Indicator Pulse -->
  <circle cx="32" cy="32" r="4.5" fill="#5eead4" opacity="0.95"/>
  <circle cx="47" cy="47" r="3.5" fill="url(#dot-grad)" filter="url(#glow)"/>
</svg>