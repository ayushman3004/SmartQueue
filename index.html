    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8F5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="canonical" href="https://serveq.tech" />

    <!-- Open Graph / Social Sharing (Absolute URLs for search bots) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://serveq.tech" />
    <meta property="og:title" content="serveQ — Smart Queue & Virtual Waiting" />
    <meta property="og:description" content="Join lines from your phone, track wait times live, and eliminate crowded waiting rooms with serveQ virtual queuing." />
    <meta property="og:image" content="https://serveq.tech/logo.png" />

    <meta name="twitter:card" content="summary" />

    <meta name="twitter:image" content="https://serveq.tech/logo.png" />

    <!-- Google Search Structured Data (Organization Logo) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ServeQ",
      "url": "https://serveq.tech",
      "logo": "https://serveq.tech/logo.png"

    <title>serveQ — Smart Queue & Virtual Waiting</title>
