<text x="544" y="1289" font-size="21" font-weight="400" fill="#52665B" text-anchor="start">Owner operations and presence</text>
<text x="544" y="1318" font-size="21" font-weight="400" fill="#52665B" text-anchor="start">Reconnect → refresh current visit</text>
<rect x="520" y="1430" width="400" height="190" rx="16" fill="#FFFFFF" stroke="#C9DAD0" stroke-width="2" stroke-dasharray="8 6"/>
