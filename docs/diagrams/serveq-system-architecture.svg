<text x="56" y="1138" font-size="22" font-weight="600" fill="#047857" text-anchor="start">03  DATA, LIVE DELIVERY, AND PROVIDERS</text>
<rect x="56" y="1190" width="400" height="306" rx="18" fill="#ECFDF5" stroke="#C9DAD0" stroke-width="2"/>
<text x="80" y="1232" font-size="30" font-weight="600" fill="#114227" text-anchor="start">MongoDB</text>
<text x="80" y="1280" font-size="21" font-weight="400" fill="#52665B" text-anchor="start">Users and businesses</text>
<text x="80" y="1317" font-size="21" font-weight="400" fill="#52665B" text-anchor="start">Bookings and live queue entries</text>
<text x="80" y="1354" font-size="21" font-weight="400" fill="#52665B" text-anchor="start">Reviews, coupons, chat messages</text>
<text x="80" y="1391" font-size="21" font-weight="400" fill="#52665B" text-anchor="start">OTP, support, and waitlist records</text>
<text x="80" y="1463" font-size="20" font-weight="400" fill="#52665B" text-anchor="start">Database accessed through the API only</text>
