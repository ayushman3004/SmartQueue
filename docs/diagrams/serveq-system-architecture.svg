<rect x="912.0550000000001" y="201" width="291.89" height="30" rx="5" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="1058" y="218" font-size="19" font-weight="500" fill="#52665B" text-anchor="middle">Live events / native alerts</text>
<text x="56" y="1690" font-size="24" font-weight="600" fill="#17372A" text-anchor="start">Architecture boundaries</text>
<text x="56" y="1730" font-size="21" font-weight="400" fill="#52665B" text-anchor="start">Solid components exist in the repository. Dashed components are planned mobile integrations.</text>
<text x="56" y="1762" font-size="21" font-weight="400" fill="#52665B" text-anchor="start">The modules run together; they are not separate deployed microservices.</text>
<text x="56" y="1794" font-size="21" font-weight="400" fill="#52665B" text-anchor="start">Payment verification, authorization, atomic writes, and reliable push need the corrections described in the design.</text>
