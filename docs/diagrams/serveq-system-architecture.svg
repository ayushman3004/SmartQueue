<text x="56" y="126" font-size="48" font-weight="600" fill="#17372A" text-anchor="start">One backend. Every customer journey.</text>
<text x="56" y="166" font-size="23" font-weight="400" fill="#52665B" text-anchor="start">Existing modular monolith with a planned Capacitor customer app</text>
<text x="56" y="236" font-size="22" font-weight="600" fill="#047857" text-anchor="start">01  CLIENT EXPERIENCES</text>
