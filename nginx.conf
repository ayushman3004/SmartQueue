map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    # Keep the browser's public host, scheme and mapped port behind proxies.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-QspVrLl5mJ4dc5SrDDIvgiqkZY0cUUzk5RDetZ+Da+E=' https://checkout.razorpay.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; frame-src 'self' https://*.razorpay.com https://challenges.cloudflare.com; connect-src 'self' https://api.serveq.tech wss://api.serveq.tech https://*.razorpay.com https://challenges.cloudflare.com" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    location /socket.io {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ~ ^/(health|healthz|live|ready)(/|$) {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    # Normalize legacy URLs with HTTP redirects, preserving query parameters.
    location = /help { return 301 /support$is_args$args; }
    location = /customer { return 301 /customers$is_args$args; }
    location = /coming-soon { return 301 /$is_args$args; }
    location = /wallet { return 301 /profile$is_args$args; }

    location ~ ^/(.+)/$ { return 301 /$1$is_args$args; }

    location ~ ^/(login|auth/callback|customers|history|queue(/[^/]+)?|booking(/[^/]+)?|business/onboarding(/[^/]+)?|business/[^/]+(/manage)?|subscription|profile|admin|401|403|unauthorized)$ {
        try_files /app.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
